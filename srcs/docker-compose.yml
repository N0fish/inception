version: "3.3"

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    environment:
#      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      SECRETS_DIR: /secrets
#     MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
#      - ./secrets:/run/secrets:ro
      - ../secrets/db_password.txt:/secrets/db_password.txt
      - ../secrets/db_root_password.txt:/secrets/db_root_password.txt
    ports:
      - "3306:3306"
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    env_file:
      - .env
    depends_on:
      - mariadb
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wordpress-data:/var/www/html
      - ../secrets/db_password.txt:/secrets/db_password.txt:ro
      - ../secrets/db_root_password.txt:/secrets/db_root_password.txt:ro
    networks:
      - inception
  
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - inception

networks:
  inception:
    driver: bridge
volumes:
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      device: ${MARIADB_VOLUME}
      o: bind

  wordpress-data:
    driver: local
    driver_opts:
      type: none
      device: ${WORDPRESS_VOLUME}
      o: bind
